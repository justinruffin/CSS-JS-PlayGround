<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSS/JS PlayGround</title>
        <link rel="stylesheet" href="style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--FONTS-->
        <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&display=swap" rel="stylesheet" />
        <!--NEON SIGN SYMBOLS-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,200,0,0&icon_names=joystick,star_shine" />
    </head>
    <body>
        <div class="header">
            <h1>CSS/JavaScript PlayGround</h1>
            <h5>By: Justin Ruffin</h5>
        </div>

        <div class="boxContainer">
            <div class="row">
                <div class="box">
                    <div class="neon">
                        <p class="neon-sign">neon vibes</p>
                        <div class="line line-1"></div>
                        <i class="fa-regular fa-snowflake fa-rotate-by neon-snowflake" style="--fa-rotate-angle: 15deg"></i>
                        <span class="material-symbols-outlined neon-joystick">joystick</span>
                        <span class="material-symbols-outlined neon-star">star_shine</span>
                    </div>
                </div>
                <div class="box">
                    <div class="floating-bubbles">
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="row">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>

        <!-- Link your external JavaScript file here -->
        <script src="script.js" defer></script>
    </body>
</html>
