<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSS/JS PlayGround</title>
        <link rel="stylesheet" href="style.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--FONTS-->
        <link href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
        <!--NEON SIGN SYMBOLS-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,200,0,0&icon_names=joystick,star_shine,rocket_launch,diamond_shine,stadia_controller,battery_charging_50,partly_cloudy_night" />
    </head>
    <body>
        <div class="header">
            <h1>CSS/JavaScript PlayGround</h1>
            <h5>By: Justin Ruffin</h5>
        </div>

        <div class="boxContainer">
            <div class="row">
                <div class="box">
                    <div class="neon">
                        <p class="neon-sign neon-shared">neon vibes</p>
                        <div class="line-1"></div>
                        <span class="material-symbols-outlined neon-joystick neon-shared">joystick</span>
                        <span class="material-symbols-outlined neon-star neon-shared">star_shine</span>
                        <span class="material-symbols-outlined neon-rocket neon-shared">rocket_launch</span>
                        <span class="material-symbols-outlined neon-diamond neon-shared">diamond_shine</span>
                        <span class="material-symbols-outlined neon-stadia-controller neon-shared">stadia_controller</span>
                        <span class="material-symbols-outlined neon-battery neon-shared">battery_charging_50</span>
                        <span class="material-symbols-outlined neon-moon neon-shared">partly_cloudy_night</span>
                    </div>
                </div>
                <div class="box">
                    <div class="floating-bubbles">
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="bubble">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="box">
                    <div class="atom-square">
                        <p>AT &nbsp;M</p>
                        <div class="atom">
                            <div class="nucleus"></div>
                            <div class="orbit"><span class="electron electron1"></span></div>
                            <div class="orbit"><span class="electron electron2"></span></div>
                            <div class="orbit"><span class="electron electron3"></span></div>
                        </div>
                    </div>
                </div>
                <div class="box"></div>
            </div>
            <div class="row">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>

        <!-- Link your external JavaScript file here -->
        <script src="script.js" defer></script>
    </body>
</html>
